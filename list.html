<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List — Glassmorphism</title>

    <!-- Tailwind CSS v4 (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --color-glass-bg: rgba(255, 255, 255, 0.12);
        --color-glass-border: rgba(255, 255, 255, 0.25);
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-8"
  >
    <!-- Glass card container -->
    <div
      class="w-full max-w-md rounded-3xl p-8
             bg-white/10 backdrop-blur-md
             border border-white/25
             shadow-[0_8px_32px_rgba(0,0,0,0.25)]"
    >
      <h1 class="text-2xl font-bold text-white mb-6 tracking-wide">
        🗂️ My Lists
      </h1>

      <!-- Unordered list -->
      <section class="mb-8">
        <h2 class="text-sm font-semibold text-white/60 uppercase tracking-widest mb-3">
          Favourites
        </h2>
        <ul class="space-y-3">
          <li
            class="flex items-center gap-3 rounded-xl px-4 py-3
                   bg-white/10 border border-white/20
                   text-white hover:bg-white/20 transition-colors cursor-pointer"
          >
            <span class="text-lg">🎵</span> Music Playlist
          </li>
          <li
            class="flex items-center gap-3 rounded-xl px-4 py-3
                   bg-white/10 border border-white/20
                   text-white hover:bg-white/20 transition-colors cursor-pointer"
          >
            <span class="text-lg">📚</span> Reading List
          </li>
          <li
            class="flex items-center gap-3 rounded-xl px-4 py-3
                   bg-white/10 border border-white/20
                   text-white hover:bg-white/20 transition-colors cursor-pointer"
          >
            <span class="text-lg">🎬</span> Watch Later
          </li>
        </ul>
      </section>

      <!-- Ordered list -->
      <section>
        <h2 class="text-sm font-semibold text-white/60 uppercase tracking-widest mb-3">
          Top Picks
        </h2>
        <ol class="space-y-3">
          <li
            class="flex items-center gap-3 rounded-xl px-4 py-3
                   bg-white/10 border border-white/20 text-white
                   hover:bg-white/20 transition-colors cursor-pointer"
          >
            <span
              class="w-7 h-7 flex items-center justify-center rounded-full
                     bg-white/20 text-sm font-bold shrink-0"
            >1</span>
            Build something cool
          </li>
          <li
            class="flex items-center gap-3 rounded-xl px-4 py-3
                   bg-white/10 border border-white/20 text-white
                   hover:bg-white/20 transition-colors cursor-pointer"
          >
            <span
              class="w-7 h-7 flex items-center justify-center rounded-full
                     bg-white/20 text-sm font-bold shrink-0"
            >2</span>
            Ship it to production
          </li>
          <li
            class="flex items-center gap-3 rounded-xl px-4 py-3
                   bg-white/10 border border-white/20 text-white
                   hover:bg-white/20 transition-colors cursor-pointer"
          >
            <span
              class="w-7 h-7 flex items-center justify-center rounded-full
                     bg-white/20 text-sm font-bold shrink-0"
            >3</span>
            Celebrate 🎉
          </li>
        </ol>
      </section>
    </div>
  </body>
</html>
